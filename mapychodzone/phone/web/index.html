<!DOCTYPE html>
<html lang="pl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MapyChodzone - piesza mapa turystyczna: szlaki i trasy">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>MapyChodzone</title>

  <!--
    MapLibre GL JS 6.4.1 (wersja, pod którą napisano maplibre_gl_web 0.27.1) i PMTiles 4.3.0.
    Strona ładuje je sama (MapLibreJsSource.preloaded w main.dart), żeby przed utworzeniem mapy
    zarejestrować protokół pmtiles://: mapa czyta paczkę regionu kawałkami (nagłówek Range).
  -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.4.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.4.1/dist/maplibre-gl.mjs';
    maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
    globalThis.maplibregl = maplibregl;
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
