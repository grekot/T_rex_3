name: trening
description: "Trening - prowadzenie przez 12-tygodniowy plan: kręgosłup lędźwiowy + redukcja"
publish_to: 'none'

# versionName i versionCode ustawia wydanie z tagu trening-vX.Y.Z
# (przy --split-per-abi Flutter dodaje 2000 dla arm64).
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # polskie kalendarze i zegary w wyborze daty i godziny (część SDK Fluttera)
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # plan.json (treść planu) i atlas.json + img/ (technika i rysunki,
    # generowane przez tool/atlas_do_json.dart z atlasu ćwiczeń)
    - assets/plan/
    - assets/plan/img/
