name: Release Zdjęcia

# Tag `zdjecia-vX.Y.Z` → APK release aplikacji Zdjęcia (zdjecia/phone) przez wspólny workflow sklepu
# rodzinnego (grekot/App_storage): podpis wspólnym kluczem, APK arm64-v8a,
# stała nazwa zdjecia.apk + app.json w GitHub Release tego repo.
# Wersja = tag bez prefiksu `zdjecia-v`. versionCode = (run_number + 10), a przy
# --split-per-abi Flutter dodaje 2000 dla arm64 – więcej niż lokalne buildy 1.0.0+1.
# Bez Firebase: Zdjęcia nie mają konta, sekret FIREBASE_SERVICE_ACCOUNT służy tylko do
# zapisu wersji w bibliotece sklepu i powiadomienia.
on:
  push:
    tags: ['zdjecia-v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#zdjecia-v}" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    uses: grekot/App_storage/.github/workflows/flutter-android-release.yml@main
    with:
      app_dir: zdjecia/phone
      asset_name: zdjecia
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ github.ref_name }}
      release_name: Zdjęcia ${{ needs.meta.outputs.version }}
      target_abi: arm64
      version_code_offset: 10
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
